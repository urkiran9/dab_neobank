resources:
  jobs:
    neobank_silver_to_gold:
      name: NeoBank_Silver_to_Gold
      tasks:
        - task_key: Get_List_of_Tables
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/neobank_silver_to_gold/01_Read_Tables_List.py
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: Ingest_Data_from_Silver_to_Gold
          depends_on:
            - task_key: Get_List_of_Tables
          disabled: false
          email_notifications: {}
          for_each_task:
            concurrency: 4
            inputs: '{{tasks.Get_List_of_Tables.values.tables_metadata}}'
            task:
              disabled: false
              email_notifications: {}
              notebook_task:
                base_parameters:
                  table_metadata: '{{input}}'
                notebook_path: ../src/neobank_silver_to_gold/01_Silver_to_Gold_Driver.py
                source: WORKSPACE
              run_if: ALL_SUCCESS
              task_key: Ingest_Data_from_Silver_to_Gold_iteration
              timeout_seconds: 0
              webhook_notifications: {}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
      parameters:
        - name: run_id
          default: "1234542"
        - name: source_system
          default: silver
      email_notifications:
        no_alert_for_skipped_runs: false
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
