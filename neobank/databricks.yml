# This is a Declarative Automation Bundle definition for neobank.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: neobank
  uuid: c0c45e0d-a5d8-4692-b3d0-a813f26052a2

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-156fee90-998c.cloud.databricks.com
    variables:
      catalog: banking
      schema: metadata
  prod:
    mode: production
    workspace:
      host: https://dbc-156fee90-998c.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/saikiranthotakura9@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/saikiranthotakura9@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: banking
      schema: metadata
    permissions:
      - user_name: saikiranthotakura9@gmail.com
        level: CAN_MANAGE
